version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: parking-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount initialization scripts and data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/HDBCarparkInformation.csv:/docker-entrypoint-initdb.d/HDBCarparkInformation.csv

volumes:
  postgres-data: