services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount initialization scripts and data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/HDBCarparkInformation.csv:/docker-entrypoint-initdb.d/HDBCarparkInformation.csv

  app:
    build:
      context: ./app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: parking
      DB_USERNAME: admin
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started

  ui:
    build:
      context: ./ui
    environment:
      BACKEND_URL: http://app:8080
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_started

volumes:
  postgres-data:
